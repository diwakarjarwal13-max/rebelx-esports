name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 1. Pure original source code ka safe backup lena
      - name: Save my lib and pubspec before scaffolding
        run: |
          mkdir -p /tmp/mysrc
          cp -r lib /tmp/mysrc/lib
          cp pubspec.yaml /tmp/mysrc/pubspec.yaml

      # 2. Fresh Android structure recreate karna
      - name: Create full Flutter project structure
        run: |
          flutter create --platforms=android --org com.rebelx --project-name esports .

      # 3. Google Services JSON ko decode karna
      - name: Decode & Copy google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret is missing!"
          fi

      # 4. Modern Flutter/Gradle syntax ke sath Firebase configurations inject karna
      - name: Configure Root and App build.gradle for Google Services
        run: |
          # Root level settings.gradle ya build.gradle ke plugins block mein id "com.google.gms.google-services" version "4.4.2" apply false ko add karna
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/build.gradle
          
          # App level build.gradle ke plugins block mein id "com.google.gms.google-services" inject karna
          sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle

      # 5. Minimum SDK version build configuration ko sahi karna
      - name: Set minimum SDK
        run: |
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle

      # 6. Aapke original features aur application logic (lib aur pubspec) ko wapas laana
      - name: Restore my main.dart and pubspec.yaml
        run: |
          cp -r /tmp/mysrc/lib/* lib/
          cp /tmp/mysrc/pubspec.yaml pubspec.yaml

      # 7. Multi-dex aur automatic resource matching issues ko crash se bachane ke liye explicitly clean build run karna
      - name: Get dependencies
        run: |
          flutter pub get
          flutter clean

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rebelx-esports-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
